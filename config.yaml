# GNN-Based BERT for Understanding Context from Music

project:
  name: gnn-bert-music-context
  seed: 42
  device: cuda

datasets:
  primary_audio: fma_small
  text_source: musiccaps
  emotion_aux: deam
  paths:
    raw: data/raw
    processed: data/processed
    splits: data/splits

audio:
  sample_rate: 22050
  n_mels: 128
  n_chroma: 12
  normalize_per_track: true
  segment_seconds: 5.0
  hop_seconds: 2.5
  use_beat_synchronous: false

graph:
  type: chord_transition
  also_build_segment_graphs: true
  similarity_threshold: 0.7
  temporal_edges: true
  similarity_edges: true
  feature: chroma

text:
  tokenizer: bert-base-uncased
  max_length: 128
  padding: max_length
  truncation: true

model:
  bert_name: bert-base-uncased
  freeze_bert: false
  gnn_type: graphsage
  gnn_hidden_dim: 128
  gnn_layers: 2
  gnn_dropout: 0.2
  fusion: cross_attention
  projection_dim: 256

train:
  batch_size: 16
  epochs: 20
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_workers: 4
  alpha_valence: 0.5
  beta_arousal: 0.5
  temperature: 0.07
  lambda_aux: 0.1

eval:
  metrics:
    - macro_f1
    - micro_f1
    - auc_pr
    - mae_valence
    - mae_arousal
    - r2
    - recall_at_1
    - recall_at_5
    - recall_at_10
  top_k_tags: 50

baselines:
  - majority_random
  - cnn_mel
  - bert_only

output:
  results_dir: results
  metrics_file: results/metrics.json
  plots_dir: results/plots
  retrieval_dir: results/retrieval_examples
  checkpoint_dir: results/checkpoints
